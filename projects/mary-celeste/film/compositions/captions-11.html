      <div id="root" data-composition-id="captions-11" data-width="1920" data-height="1080">
      <div id="cap206" class="cap" style="opacity:0"><span>If they have to leave, they will carve<br>their destination.</span></div>
      <div id="cap207" class="cap" style="opacity:0"><span>If they leave in danger, they will carve a<br>small cross.</span></div>
      <div id="cap208" class="cap" style="opacity:0"><span>Then England goes to war with Spain, and<br>every able ship is wanted for the fight.</span></div>
      <div id="cap209" class="cap" style="opacity:0"><span>White is stuck on the wrong side of the<br>ocean for three years.</span></div>
      <div id="cap210" class="cap" style="opacity:0"><span>He finally lands on Roanoke on August<br>eighteenth, 1590.</span></div>
      <div id="cap211" class="cap" style="opacity:0"><span>It is his granddaughter's third birthday.</span></div>
      <div id="cap212" class="cap" style="opacity:0"><span>The houses have been taken down.</span></div>
      <div id="cap213" class="cap" style="opacity:0"><span>The settlement is deserted.</span></div>
      <div id="cap214" class="cap" style="opacity:0"><span>On a post of the palisade, one word,<br>carved in capital letters.</span></div>
      <div id="cap215" class="cap" style="opacity:0"><span>Croatoan.</span></div>
      <div id="cap216" class="cap" style="opacity:0"><span>The name of a nearby island, and of the<br>people who lived there.</span></div>
      <div id="cap217" class="cap" style="opacity:0"><span>And no cross.</span></div>
      <div id="cap218" class="cap" style="opacity:0"><span>No cross.</span></div>
      <div id="cap219" class="cap" style="opacity:0"><span>Which means that whatever happened, it was<br>not carved in distress.</span></div>
      <div id="cap220" class="cap" style="opacity:0"><span>Which means White had every reason to<br>hope.</span></div>
      <div id="cap221" class="cap" style="opacity:0"><span>Then the weather turns.</span></div>
      <div id="cap222" class="cap" style="opacity:0"><span>Rough seas.</span></div>
      <div id="cap223" class="cap" style="opacity:0"><span>Lost anchors.</span></div>
      <div id="cap224" class="cap" style="opacity:0"><span>A fleet in no shape to search.</span></div>
      <div id="cap225" class="cap" style="opacity:0"><span>The ships turn back for England.</span></div>
      <div id="cap226" class="cap" style="opacity:0"><span>John White never sees his daughter or his<br>granddaughter again.</span></div>
      <div id="cap227" class="cap" style="opacity:0"><span>Think about that.</span></div>
      </div>
