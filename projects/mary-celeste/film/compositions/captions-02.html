      <div id="root" data-composition-id="captions-02" data-width="1920" data-height="1080">
      <div id="cap20" class="cap" style="opacity:0"><span>They are the ones where almost everything<br>is ordinary, and one piece refuses to fit.</span></div>
      <div id="cap21" class="cap" style="opacity:0"><span>That is unusual, because mysteries are<br>supposed to be loud.</span></div>
      <div id="cap22" class="cap" style="opacity:0"><span>They are supposed to come with curses and<br>shadows and a dramatic thunderclap.</span></div>
      <div id="cap23" class="cap" style="opacity:0"><span>Instead, these come with cargo manifests,<br>weather conditions, and a court in</span></div>
      <div id="cap24" class="cap" style="opacity:0"><span>Gibraltar with a great deal of paperwork.</span></div>
      <div id="cap25" class="cap" style="opacity:0"><span>Some will say this is overthinking it.</span></div>
      <div id="cap26" class="cap" style="opacity:0"><span>Ships get into trouble.</span></div>
      <div id="cap27" class="cap" style="opacity:0"><span>Waves hit lighthouses.</span></div>
      <div id="cap28" class="cap" style="opacity:0"><span>People die in the mountains.</span></div>
      <div id="cap29" class="cap" style="opacity:0"><span>All true.</span></div>
      <div id="cap30" class="cap" style="opacity:0"><span>And in several of these cases, a sensible<br>explanation exists.</span></div>
      <div id="cap31" class="cap" style="opacity:0"><span>But a sensible explanation and a finished<br>story are two different things.</span></div>
      <div id="cap32" class="cap" style="opacity:0"><span>Keep that in mind.</span></div>
      <div id="cap33" class="cap" style="opacity:0"><span>Because the first case involves a ship<br>that did nothing wrong, and nobody on it.</span></div>
      <div id="cap34" class="cap" style="opacity:0"><span>December 1872.</span></div>
      <div id="cap35" class="cap" style="opacity:0"><span>The middle of the Atlantic, roughly<br>halfway between the Azores and Portugal.</span></div>
      <div id="cap36" class="cap" style="opacity:0"><span>The crew of a ship called the Dei Gratia<br>spots another vessel behaving strangely,</span></div>
      <div id="cap37" class="cap" style="opacity:0"><span>and spends a couple of hours trying to<br>hail it.</span></div>
      <div id="cap38" class="cap" style="opacity:0"><span>Nobody answers.</span></div>
      <div id="cap39" class="cap" style="opacity:0"><span>A boarding party climbs aboard the Mary<br>Celeste.</span></div>
      <div id="cap40" class="cap" style="opacity:0"><span>The sails are partly set.</span></div>
