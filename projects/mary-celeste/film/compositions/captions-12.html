      <div id="root" data-composition-id="captions-12" data-width="1920" data-height="1080">
      <div id="cap228" class="cap" style="opacity:0"><span>Not the mystery.</span></div>
      <div id="cap229" class="cap" style="opacity:0"><span>The man.</span></div>
      <div id="cap230" class="cap" style="opacity:0"><span>Three years of trying to get home, and a<br>birthday spent reading a single carved</span></div>
      <div id="cap231" class="cap" style="opacity:0"><span>word.</span></div>
      <div id="cap232" class="cap" style="opacity:0"><span>One common reading is that the word was<br>simply a message.</span></div>
      <div id="cap233" class="cap" style="opacity:0"><span>Nothing cryptic about it.</span></div>
      <div id="cap234" class="cap" style="opacity:0"><span>It may be the most honest note in this<br>entire story.</span></div>
      <div id="cap235" class="cap" style="opacity:0"><span>It said exactly where they were going.</span></div>
      <div id="cap236" class="cap" style="opacity:0"><span>And it did not help anyone.</span></div>
      <div id="cap237" class="cap" style="opacity:0"><span>So what does all of this actually mean?</span></div>
      <div id="cap238" class="cap" style="opacity:0"><span>Look at what the legends did.</span></div>
      <div id="cap239" class="cap" style="opacity:0"><span>They gave the Mary Celeste a warm<br>breakfast.</span></div>
      <div id="cap240" class="cap" style="opacity:0"><span>They gave the lighthouse keepers a storm<br>and a prayer.</span></div>
      <div id="cap241" class="cap" style="opacity:0"><span>They gave Strasbourg a daily body count.</span></div>
      <div id="cap242" class="cap" style="opacity:0"><span>Every time, someone looked at an empty<br>space and could not stand it.</span></div>
      <div id="cap243" class="cap" style="opacity:0"><span>The real record is thinner, and quieter.</span></div>
      <div id="cap244" class="cap" style="opacity:0"><span>And the gap is the point.</span></div>
      <div id="cap245" class="cap" style="opacity:0"><span>Most people never connect these dots<br>because each story seems to belong to a</span></div>
      <div id="cap246" class="cap" style="opacity:0"><span>different genre.</span></div>
      <div id="cap247" class="cap" style="opacity:0"><span>A ghost ship.</span></div>
      <div id="cap248" class="cap" style="opacity:0"><span>A medical oddity.</span></div>
      <div id="cap249" class="cap" style="opacity:0"><span>A lighthouse tale.</span></div>
      <div id="cap250" class="cap" style="opacity:0"><span>A cold case.</span></div>
      <div id="cap251" class="cap" style="opacity:0"><span>A hiking disaster.</span></div>
      <div id="cap252" class="cap" style="opacity:0"><span>A colonial footnote.</span></div>
      <div id="cap253" class="cap" style="opacity:0"><span>Put them side by side and they are one<br>story about the same thing.</span></div>
