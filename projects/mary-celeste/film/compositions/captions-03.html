      <div id="cap40" class="cap" style="opacity:0"><span>The sails are partly set.</span></div>
      <div id="cap41" class="cap" style="opacity:0"><span>The cargo, more than seventeen hundred<br>barrels of industrial alcohol, is mostly</span></div>
      <div id="cap42" class="cap" style="opacity:0"><span>fine.</span></div>
      <div id="cap43" class="cap" style="opacity:0"><span>The lifeboat is gone.</span></div>
      <div id="cap44" class="cap" style="opacity:0"><span>Captain Benjamin Briggs, his wife, their<br>two-year-old daughter, and seven crew</span></div>
      <div id="cap45" class="cap" style="opacity:0"><span>members are gone with it.</span></div>
      <div id="cap46" class="cap" style="opacity:0"><span>The last entry in the log is dated<br>November twenty-fifth.</span></div>
      <div id="cap47" class="cap" style="opacity:0"><span>Ten days earlier.</span></div>
      <div id="cap48" class="cap" style="opacity:0"><span>This is where the legend takes over.</span></div>
      <div id="cap49" class="cap" style="opacity:0"><span>In</span></div>
      <div id="cap50" class="cap" style="opacity:0"><span>a young ship's surgeon named Arthur Conan<br>Doyle wrote a short story about a ghost</span></div>
      <div id="cap51" class="cap" style="opacity:0"><span>ship.</span></div>
      <div id="cap52" class="cap" style="opacity:0"><span>It was fiction.</span></div>
      <div id="cap53" class="cap" style="opacity:0"><span>He even changed the names.</span></div>
      <div id="cap54" class="cap" style="opacity:0"><span>Readers believed it anyway, and later<br>retellings kept improving it, until the</span></div>
      <div id="cap55" class="cap" style="opacity:0"><span>story had a hot breakfast on the table and<br>tea that was still warm.</span></div>
      <div id="cap56" class="cap" style="opacity:0"><span>Nothing in the record supports any of<br>that.</span></div>
      <div id="cap57" class="cap" style="opacity:0"><span>The boarding party spent hours just trying<br>to reach the ship in the first place.</span></div>
      <div id="cap58" class="cap" style="opacity:0"><span>Nobody's tea survives that.</span></div>
      <div id="cap59" class="cap" style="opacity:0"><span>What the record does say is odder in a<br>quieter way.</span></div>
      <div id="cap60" class="cap" style="opacity:0"><span>A court in Gibraltar spent months<br>suspecting the crew of the Dei Gratia of</span></div>
      <div id="cap61" class="cap" style="opacity:0"><span>foul play, and in the end found no<br>evidence of</span></div>
