      <div id="cap121" class="cap" style="opacity:0"><span>Years later, dramatic log entries entered<br>the story: a storm of terrible fury, the</span></div>
      <div id="cap122" class="cap" style="opacity:0"><span>keepers praying, one of them weeping.</span></div>
      <div id="cap123" class="cap" style="opacity:0"><span>Those entries are not part of the original<br>record.</span></div>
      <div id="cap124" class="cap" style="opacity:0"><span>They were added to the story long after<br>the men were gone.</span></div>
      <div id="cap125" class="cap" style="opacity:0"><span>Three men, one island, and an ocean to<br>blame.</span></div>
      <div id="cap126" class="cap" style="opacity:0"><span>The next case had a beach.</span></div>
      <div id="cap127" class="cap" style="opacity:0"><span>December first, 1948. Somerton Beach,<br>south of Adelaide, Australia.</span></div>
      <div id="cap128" class="cap" style="opacity:0"><span>A well-dressed man is found slumped<br>against the seawall.</span></div>
      <div id="cap129" class="cap" style="opacity:0"><span>No wallet.</span></div>
      <div id="cap130" class="cap" style="opacity:0"><span>No identification.</span></div>
      <div id="cap131" class="cap" style="opacity:0"><span>The labels have been removed from his<br>clothing.</span></div>
      <div id="cap132" class="cap" style="opacity:0"><span>A suitcase linked to him turns up at the<br>railway station, and the labels are</span></div>
      <div id="cap133" class="cap" style="opacity:0"><span>missing from those clothes too.</span></div>
      <div id="cap134" class="cap" style="opacity:0"><span>It carries two printed words.</span></div>
      <div id="cap135" class="cap" style="opacity:0"><span>Tamam Shud.</span></div>
      <div id="cap136" class="cap" style="opacity:0"><span>Persian for ended, or finished.</span></div>
      <div id="cap137" class="cap" style="opacity:0"><span>The scrap had been torn from the last page<br>of a copy of the Rubaiyat of Omar Khayyam.</span></div>
      <div id="cap138" class="cap" style="opacity:0"><span>A copy with that page missing had been<br>found in a car near the beach.</span></div>
      <div id="cap139" class="cap" style="opacity:0"><span>Nearby, a string of letters that<br>investigators took for a code.</span></div>
