      <div id="cap161" class="cap" style="opacity:0"><span>On February twenty-sixth, searchers find<br>their tent, half buried in snow.</span></div>
      <div id="cap162" class="cap" style="opacity:0"><span>It has been cut open from the inside.</span></div>
      <div id="cap163" class="cap" style="opacity:0"><span>Their supplies and warm clothing are still<br>in it.</span></div>
      <div id="cap164" class="cap" style="opacity:0"><span>Some of the hikers had fled into the snow<br>in their socks, or barefoot.</span></div>
      <div id="cap165" class="cap" style="opacity:0"><span>The search turns up the hikers over the<br>following weeks, at different distances</span></div>
      <div id="cap166" class="cap" style="opacity:0"><span>from the camp.</span></div>
      <div id="cap167" class="cap" style="opacity:0"><span>Some had injuries that investigators<br>struggled to explain.</span></div>
      <div id="cap168" class="cap" style="opacity:0"><span>For decades, the theories ran from the<br>military to the supernatural.</span></div>
      <div id="cap169" class="cap" style="opacity:0"><span>Then, in January 2021, two Swiss<br>researchers, Alexander Puzrin and Johan</span></div>
      <div id="cap170" class="cap" style="opacity:0"><span>Gaume, published a study in the journal<br>Communications Earth and Environment.</span></div>
      <div id="cap171" class="cap" style="opacity:0"><span>Their model went like this.</span></div>
      <div id="cap172" class="cap" style="opacity:0"><span>The hikers had cut into the slope to pitch<br>their tent.</span></div>
      <div id="cap173" class="cap" style="opacity:0"><span>Wind piled snow above them.</span></div>
      <div id="cap174" class="cap" style="opacity:0"><span>About nine hours later, a small slab<br>avalanche came down.</span></div>
      <div id="cap175" class="cap" style="opacity:0"><span>Not a huge one.</span></div>
      <div id="cap176" class="cap" style="opacity:0"><span>Just enough.</span></div>
      <div id="cap177" class="cap" style="opacity:0"><span>The tent was no longer safe, so they cut<br>their way out.</span></div>
      <div id="cap178" class="cap" style="opacity:0"><span>Russian authorities who reopened the case<br>also concluded an avalanche was the main</span></div>
      <div id="cap179" class="cap" style="opacity:0"><span>cause.</span></div>
