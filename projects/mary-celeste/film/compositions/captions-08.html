      <div id="cap140" class="cap" style="opacity:0"><span>For more than seventy years, he had no<br>name.</span></div>
      <div id="cap141" class="cap" style="opacity:0"><span>Then, in July 2022, researchers at the<br>University of Adelaide, led by Professor</span></div>
      <div id="cap142" class="cap" style="opacity:0"><span>Derek Abbott together with the genealogist<br>Colleen Fitzpatrick, announced a DNA</span></div>
      <div id="cap143" class="cap" style="opacity:0"><span>match.</span></div>
      <div id="cap144" class="cap" style="opacity:0"><span>Carl Charles Webb.</span></div>
      <div id="cap145" class="cap" style="opacity:0"><span>Forty-three years old.</span></div>
      <div id="cap146" class="cap" style="opacity:0"><span>An electrical engineer from Melbourne.</span></div>
      <div id="cap147" class="cap" style="opacity:0"><span>The name solves one problem and creates<br>another.</span></div>
      <div id="cap148" class="cap" style="opacity:0"><span>A name does not explain the missing<br>labels.</span></div>
      <div id="cap149" class="cap" style="opacity:0"><span>It does not explain the torn page, or the<br>code, or why a man from Melbourne ended up</span></div>
      <div id="cap150" class="cap" style="opacity:0"><span>on that particular beach.</span></div>
      <div id="cap151" class="cap" style="opacity:0"><span>Getting the answer to who only made the<br>question of why louder.</span></div>
      <div id="cap152" class="cap" style="opacity:0"><span>At this point, a reasonable person might<br>say, so what.</span></div>
      <div id="cap153" class="cap" style="opacity:0"><span>Storms happen.</span></div>
      <div id="cap154" class="cap" style="opacity:0"><span>Panic happens.</span></div>
      <div id="cap155" class="cap" style="opacity:0"><span>A man can die on a beach.</span></div>
      <div id="cap156" class="cap" style="opacity:0"><span>True.</span></div>
      <div id="cap157" class="cap" style="opacity:0"><span>But the evidence does not stop there.</span></div>
      <div id="cap158" class="cap" style="opacity:0"><span>February 1959. The northern Ural<br>Mountains.</span></div>
      <div id="cap159" class="cap" style="opacity:0"><span>Nine experienced hikers, led by a<br>twenty-three-year-old named Igor Dyatlov,</span></div>
      <div id="cap160" class="cap" style="opacity:0"><span>spend the night on a mountain slope.</span></div>
      <div id="cap161" class="cap" style="opacity:0"><span>On February twenty-sixth, searchers find<br>their tent, half buried in snow.</span></div>
