      <div id="cap83" class="cap" style="opacity:0"><span>But historians point out that the accounts<br>mentioning deaths come from later</span></div>
      <div id="cap84" class="cap" style="opacity:0"><span>retellings, not from the earliest sources.</span></div>
      <div id="cap85" class="cap" style="opacity:0"><span>What is solidly documented is the dancing.</span></div>
      <div id="cap86" class="cap" style="opacity:0"><span>A city in the middle of famine and<br>disease, watching its own neighbors unable</span></div>
      <div id="cap87" class="cap" style="opacity:0"><span>to stop.</span></div>
      <div id="cap88" class="cap" style="opacity:0"><span>Ergot, a grain mold, is the usual suspect.</span></div>
      <div id="cap89" class="cap" style="opacity:0"><span>But it tends to restrict movement, not<br>power someone through days of dancing.</span></div>
      <div id="cap90" class="cap" style="opacity:0"><span>The historian John Waller argues for<br>something harder to hear: mass stress, in</span></div>
      <div id="cap91" class="cap" style="opacity:0"><span>a place already terrified of a curse from<br>Saint Vitus.</span></div>
      <div id="cap92" class="cap" style="opacity:0"><span>Which means the cause may not have been a<br>poison at all.</span></div>
      <div id="cap93" class="cap" style="opacity:0"><span>It may have been fear, passed along like a<br>cold.</span></div>
      <div id="cap94" class="cap" style="opacity:0"><span>At least Strasbourg had witnesses.</span></div>
      <div id="cap95" class="cap" style="opacity:0"><span>The next case had a lighthouse.</span></div>
      <div id="cap96" class="cap" style="opacity:0"><span>December 1900. Eilean Mor, the largest of<br>the Flannan Isles, about twenty miles west</span></div>
      <div id="cap97" class="cap" style="opacity:0"><span>of the Isle of Lewis in Scotland.</span></div>
      <div id="cap98" class="cap" style="opacity:0"><span>The lighthouse has been operating for<br>barely more than a year.</span></div>
