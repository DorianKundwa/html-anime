      <div id="cap101" class="cap" style="opacity:0"><span>On the night of December fifteenth, a<br>passing steamer called the Archtor notices</span></div>
      <div id="cap102" class="cap" style="opacity:0"><span>the light is out.</span></div>
      <div id="cap103" class="cap" style="opacity:0"><span>The steamer reports it when it reaches<br>port.</span></div>
      <div id="cap104" class="cap" style="opacity:0"><span>That report never reaches the people who<br>needed it in time.</span></div>
      <div id="cap105" class="cap" style="opacity:0"><span>Eleven days later, on December<br>twenty-sixth, the relief ship Hesperus</span></div>
      <div id="cap106" class="cap" style="opacity:0"><span>arrives.</span></div>
      <div id="cap107" class="cap" style="opacity:0"><span>There is no flag.</span></div>
      <div id="cap108" class="cap" style="opacity:0"><span>There is no answer to the horn.</span></div>
      <div id="cap109" class="cap" style="opacity:0"><span>Relief keeper Joseph Moore goes ashore and<br>finds the lighthouse empty.</span></div>
      <div id="cap110" class="cap" style="opacity:0"><span>The record is dry.</span></div>
      <div id="cap111" class="cap" style="opacity:0"><span>The log had been kept up through December<br>thirteenth.</span></div>
      <div id="cap112" class="cap" style="opacity:0"><span>Notes for the fourteenth and fifteenth, up<br>to nine in the morning, were written on a</span></div>
      <div id="cap113" class="cap" style="opacity:0"><span>slate, waiting to be copied in.</span></div>
      <div id="cap114" class="cap" style="opacity:0"><span>Two sets of oilskins and sea boots were<br>missing, and Moore, who knew the routine,</span></div>
      <div id="cap115" class="cap" style="opacity:0"><span>said the men wore those only when heading<br>down</span></div>
      <div id="cap116" class="cap" style="opacity:0"><span>to the landings.</span></div>
