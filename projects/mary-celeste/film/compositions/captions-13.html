      <div id="root" data-composition-id="captions-13" data-width="1920" data-height="1080">
      <div id="cap253" class="cap" style="opacity:0"><span>Put them side by side and they are one<br>story about the same thing.</span></div>
      <div id="cap254" class="cap" style="opacity:0"><span>People can survive not knowing.</span></div>
      <div id="cap255" class="cap" style="opacity:0"><span>What they cannot survive is not having an<br>ending.</span></div>
      <div id="cap256" class="cap" style="opacity:0"><span>So the mind supplies one.</span></div>
      <div id="cap257" class="cap" style="opacity:0"><span>Tea.</span></div>
      <div id="cap258" class="cap" style="opacity:0"><span>Prayers.</span></div>
      <div id="cap259" class="cap" style="opacity:0"><span>A curse.</span></div>
      <div id="cap260" class="cap" style="opacity:0"><span>A monster.</span></div>
      <div id="cap261" class="cap" style="opacity:0"><span>The invention is not the creepy part.</span></div>
      <div id="cap262" class="cap" style="opacity:0"><span>The creepy part is how badly the invention<br>was needed.</span></div>
      <div id="cap263" class="cap" style="opacity:0"><span>Six places.</span></div>
      <div id="cap264" class="cap" style="opacity:0"><span>Six silences.</span></div>
      <div id="cap265" class="cap" style="opacity:0"><span>A ship, a street, a lighthouse, a beach, a<br>mountain, a post.</span></div>
      <div id="cap266" class="cap" style="opacity:0"><span>In each one, somebody was supposed to come<br>back.</span></div>
      <div id="cap267" class="cap" style="opacity:0"><span>In each one, somebody was supposed to<br>leave a note.</span></div>
      <div id="cap268" class="cap" style="opacity:0"><span>At the start, there was a simple idea.</span></div>
      <div id="cap269" class="cap" style="opacity:0"><span>Every culture agrees that somebody should<br>have left a note.</span></div>
      <div id="cap270" class="cap" style="opacity:0"><span>Now it looks like the note was never the<br>point.</span></div>
      <div id="cap271" class="cap" style="opacity:0"><span>The point is what happens when it goes<br>missing.</span></div>
      <div id="cap272" class="cap" style="opacity:0"><span>A tea is invented.</span></div>
      <div id="cap273" class="cap" style="opacity:0"><span>A storm is invented.</span></div>
      <div id="cap274" class="cap" style="opacity:0"><span>A ship's name is kept alive for a hundred<br>and fifty years.</span></div>
      <div id="cap275" class="cap" style="opacity:0"><span>Maybe that is the real question underneath<br>all six.</span></div>
      <div id="cap276" class="cap" style="opacity:0"><span>Why do we need someone to be coming back<br>for us?</span></div>
      <div id="cap277" class="cap" style="opacity:0"><span>And why, when nobody does, can we not stop<br>writing the note?</span></div>
      <div id="cap278" class="cap" style="opacity:0"><span>Somewhere right now, someone is carving a<br>word into a post.</span></div>
