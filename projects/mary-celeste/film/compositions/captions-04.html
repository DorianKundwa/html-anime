      <div id="cap61" class="cap" style="opacity:0"><span>foul play, and in the end found no<br>evidence of</span></div>
      <div id="cap62" class="cap" style="opacity:0"><span>it.</span></div>
      <div id="cap63" class="cap" style="opacity:0"><span>The stains on the captain's sword turned<br>out to be rust.</span></div>
      <div id="cap64" class="cap" style="opacity:0"><span>The most likely explanation is that Briggs<br>believed his ship was in danger, perhaps</span></div>
      <div id="cap65" class="cap" style="opacity:0"><span>from the cargo or from water in the hold,<br>and</span></div>
      <div id="cap66" class="cap" style="opacity:0"><span>ordered everyone into the lifeboat.</span></div>
      <div id="cap67" class="cap" style="opacity:0"><span>That is a theory.</span></div>
      <div id="cap68" class="cap" style="opacity:0"><span>The lifeboat was never found.</span></div>
      <div id="cap69" class="cap" style="opacity:0"><span>A ship with nobody on it is unsettling.</span></div>
      <div id="cap70" class="cap" style="opacity:0"><span>A town with everybody in it is worse.</span></div>
      <div id="cap71" class="cap" style="opacity:0"><span>July 1518. Strasbourg.</span></div>
      <div id="cap72" class="cap" style="opacity:0"><span>A woman known as Frau Troffea steps into<br>the street and begins to dance.</span></div>
      <div id="cap73" class="cap" style="opacity:0"><span>No music.</span></div>
      <div id="cap74" class="cap" style="opacity:0"><span>No occasion.</span></div>
      <div id="cap75" class="cap" style="opacity:0"><span>She keeps going for days.</span></div>
      <div id="cap76" class="cap" style="opacity:0"><span>The chroniclers say others joined her, and<br>that within about a month, as many as four</span></div>
      <div id="cap77" class="cap" style="opacity:0"><span>hundred people were dancing.</span></div>
      <div id="cap78" class="cap" style="opacity:0"><span>The city authorities considered their<br>options and decided the cure was more</span></div>
      <div id="cap79" class="cap" style="opacity:0"><span>dancing.</span></div>
      <div id="cap80" class="cap" style="opacity:0"><span>This did not help.</span></div>
      <div id="cap81" class="cap" style="opacity:0"><span>Here is where the popular version and the<br>record part ways.</span></div>
      <div id="cap82" class="cap" style="opacity:0"><span>The popular version has people dropping<br>dead by the dozen, fifteen a day.</span></div>
      <div id="cap83" class="cap" style="opacity:0"><span>But historians point out that the accounts<br>mentioning deaths come from later</span></div>
