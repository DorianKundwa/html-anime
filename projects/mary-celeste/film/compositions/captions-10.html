      <div id="root" data-composition-id="captions-10" data-width="1920" data-height="1080">
      <div id="cap181" class="cap" style="opacity:0"><span>Except the researchers themselves describe<br>what they offered as a plausible</span></div>
      <div id="cap182" class="cap" style="opacity:0"><span>explanation, not a closed case.</span></div>
      <div id="cap183" class="cap" style="opacity:0"><span>Plausible.</span></div>
      <div id="cap184" class="cap" style="opacity:0"><span>That is a different word from solved.</span></div>
      <div id="cap185" class="cap" style="opacity:0"><span>And that is what brings the whole thing<br>into focus.</span></div>
      <div id="cap186" class="cap" style="opacity:0"><span>The earlier cases were never</span></div>
      <div id="cap187" class="cap" style="opacity:0"><span>isolated.</span></div>
      <div id="cap188" class="cap" style="opacity:0"><span>They were a pattern.</span></div>
      <div id="cap189" class="cap" style="opacity:0"><span>In every one, a perfectly ordinary<br>explanation exists.</span></div>
      <div id="cap190" class="cap" style="opacity:0"><span>A lifeboat.</span></div>
      <div id="cap191" class="cap" style="opacity:0"><span>A wave.</span></div>
      <div id="cap192" class="cap" style="opacity:0"><span>A fear.</span></div>
      <div id="cap193" class="cap" style="opacity:0"><span>A cut slope.</span></div>
      <div id="cap194" class="cap" style="opacity:0"><span>And in every one, the ordinary explanation<br>fits the facts, and the people are still</span></div>
      <div id="cap195" class="cap" style="opacity:0"><span>gone.</span></div>
      <div id="cap196" class="cap" style="opacity:0"><span>One more.</span></div>
      <div id="cap197" class="cap" style="opacity:0"><span>And this one has a word carved into it.</span></div>
      <div id="cap198" class="cap" style="opacity:0"><span>In 1587, an artist named John White leads<br>a group of English settlers to Roanoke</span></div>
      <div id="cap199" class="cap" style="opacity:0"><span>Island, off the coast of what is now North</span></div>
      <div id="cap200" class="cap" style="opacity:0"><span>Carolina.</span></div>
      <div id="cap201" class="cap" style="opacity:0"><span>About a hundred and fifteen men, women,<br>and children.</span></div>
      <div id="cap202" class="cap" style="opacity:0"><span>Among them are his daughter, and his<br>newborn granddaughter, Virginia Dare.</span></div>
      <div id="cap203" class="cap" style="opacity:0"><span>The first English child born in the<br>Americas.</span></div>
      <div id="cap204" class="cap" style="opacity:0"><span>White sails back to England for supplies,<br>promising to return soon.</span></div>
      <div id="cap205" class="cap" style="opacity:0"><span>Before he goes, he and the colonists agree<br>on a signal.</span></div>
      </div>
