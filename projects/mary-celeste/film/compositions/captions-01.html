      <div id="cap0" class="cap" style="opacity:0"><span>Every culture on Earth agrees on one thing<br>about the missing.</span></div>
      <div id="cap1" class="cap" style="opacity:0"><span>Somebody should have left a note.</span></div>
      <div id="cap2" class="cap" style="opacity:0"><span>A ship should come with a log.</span></div>
      <div id="cap3" class="cap" style="opacity:0"><span>A settlement should come with a letter.</span></div>
      <div id="cap4" class="cap" style="opacity:0"><span>A man found on a beach should come with a<br>wallet, and ideally a name.</span></div>
      <div id="cap5" class="cap" style="opacity:0"><span>But history keeps a small, stubborn<br>collection of cases where the paperwork</span></div>
      <div id="cap6" class="cap" style="opacity:0"><span>simply stops.</span></div>
      <div id="cap7" class="cap" style="opacity:0"><span>No note.</span></div>
      <div id="cap8" class="cap" style="opacity:0"><span>No wallet.</span></div>
      <div id="cap9" class="cap" style="opacity:0"><span>Just a quiet deck, an empty room, a single<br>word carved into a post.</span></div>
      <div id="cap10" class="cap" style="opacity:0"><span>And here is the part nobody warns about.</span></div>
      <div id="cap11" class="cap" style="opacity:0"><span>The truth behind these stories is usually<br>stranger, and quieter, than the legend.</span></div>
      <div id="cap12" class="cap" style="opacity:0"><span>The famous version has ghosts and warm<br>cups of tea.</span></div>
      <div id="cap13" class="cap" style="opacity:0"><span>The record has a missing lifeboat, a slate<br>with half a day written on it, and a scrap</span></div>
      <div id="cap14" class="cap" style="opacity:0"><span>of paper that says the end.</span></div>
      <div id="cap15" class="cap" style="opacity:0"><span>Six cases.</span></div>
      <div id="cap16" class="cap" style="opacity:0"><span>Real names, real dates, and the exact<br>places where the legend and the record</span></div>
      <div id="cap17" class="cap" style="opacity:0"><span>quietly go their separate ways.</span></div>
      <div id="cap18" class="cap" style="opacity:0"><span>Here is the central claim.</span></div>
      <div id="cap19" class="cap" style="opacity:0"><span>The creepiest mysteries in history are not<br>the ones with monsters.</span></div>
      <div id="cap20" class="cap" style="opacity:0"><span>They are the ones where almost everything<br>is ordinary, and one piece refuses to fit.</span></div>
      </div>
