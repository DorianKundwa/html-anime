      <div id="root" data-composition-id="captions-04" data-width="1920" data-height="1080">
      <div id="cap63" class="cap" style="opacity:0"><span>Nobody has mentioned a belief.</span></div>
      <div id="cap64" class="cap" style="opacity:0"><span>Nobody has mentioned a leader.</span></div>
      <div id="cap65" class="cap" style="opacity:0"><span>Singer listed six conditions that make<br>this kind of influence possible, and the</span></div>
      <div id="cap66" class="cap" style="opacity:0"><span>first sounds almost insultingly simple.</span></div>
      <div id="cap67" class="cap" style="opacity:0"><span>The person must not know there is any<br>plan.</span></div>
      <div id="cap68" class="cap" style="opacity:0"><span>Nora does not know there is one.</span></div>
      <div id="cap69" class="cap" style="opacity:0"><span>Maybe there is not, yet.</span></div>
      <div id="cap70" class="cap" style="opacity:0"><span>Maybe Daniel is just lonely too.</span></div>
      <div id="cap71" class="cap" style="opacity:0"><span>Which raises the question that haunts<br>every story like this one.</span></div>
      <div id="cap72" class="cap" style="opacity:0"><span>How often is the first friendly face a<br>recruiter, and how often is it simply a</span></div>
      <div id="cap73" class="cap" style="opacity:0"><span>friend who was recruited himself?</span></div>
      <div id="cap74" class="cap" style="opacity:0"><span>Stage two is the warmth.</span></div>
      <div id="cap75" class="cap" style="opacity:0"><span>On Thursday, the room smells like garlic<br>and wet coats.</span></div>
      <div id="cap76" class="cap" style="opacity:0"><span>Strangers learn her name in the first five<br>minutes and remember it.</span></div>
      <div id="cap77" class="cap" style="opacity:0"><span>A woman asks about her green backpack.</span></div>
      <div id="cap78" class="cap" style="opacity:0"><span>A man laughs at something she says, a real<br>laugh, and it goes straight through her.</span></div>
      <div id="cap79" class="cap" style="opacity:0"><span>For three weeks nobody has laughed at<br>anything she said.</span></div>
      <div id="cap80" class="cap" style="opacity:0"><span>By Sunday, she has been hugged eleven<br>times.</span></div>
      <div id="cap81" class="cap" style="opacity:0"><span>She counts.</span></div>
      <div id="cap82" class="cap" style="opacity:0"><span>She has also been given a nickname, a seat<br>at the table, and a standing invitation.</span></div>
