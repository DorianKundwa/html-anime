      <div id="root" data-composition-id="captions-03" data-width="1920" data-height="1080">
      <div id="cap40" class="cap" style="opacity:0"><span>They were people in transition.</span></div>
      <div id="cap41" class="cap" style="opacity:0"><span>People between things.</span></div>
      <div id="cap42" class="cap" style="opacity:0"><span>People like Nora.</span></div>
      <div id="cap43" class="cap" style="opacity:0"><span>The group she is about to meet calls<br>itself the Harbor.</span></div>
      <div id="cap44" class="cap" style="opacity:0"><span>Its leader, Julian Marrow, is invented for<br>this story, but every move he makes comes</span></div>
      <div id="cap45" class="cap" style="opacity:0"><span>straight from the research.</span></div>
      <div id="cap46" class="cap" style="opacity:0"><span>And by the time the walls become visible,<br>the person inside has usually helped to</span></div>
      <div id="cap47" class="cap" style="opacity:0"><span>build them.</span></div>
      <div id="cap48" class="cap" style="opacity:0"><span>So how does someone get from a laundromat<br>to a locked kitchen?</span></div>
      <div id="cap49" class="cap" style="opacity:0"><span>One stage at a time.</span></div>
      <div id="cap50" class="cap" style="opacity:0"><span>Stage one is the crack.</span></div>
      <div id="cap51" class="cap" style="opacity:0"><span>A man at the next machine is folding<br>towels very slowly, the way people do when</span></div>
      <div id="cap52" class="cap" style="opacity:0"><span>they want to be asked about it.</span></div>
      <div id="cap53" class="cap" style="opacity:0"><span>His name is Daniel.</span></div>
      <div id="cap54" class="cap" style="opacity:0"><span>He volunteers at a community dinner on<br>Thursdays.</span></div>
      <div id="cap55" class="cap" style="opacity:0"><span>Free food.</span></div>
      <div id="cap56" class="cap" style="opacity:0"><span>About twenty people.</span></div>
      <div id="cap57" class="cap" style="opacity:0"><span>Nobody pushes anything.</span></div>
      <div id="cap58" class="cap" style="opacity:0"><span>Nora hears herself say she might come.</span></div>
      <div id="cap59" class="cap" style="opacity:0"><span>Researchers describe recruiters working<br>where people are in motion, near campuses,</span></div>
      <div id="cap60" class="cap" style="opacity:0"><span>bus depots, and new neighborhoods, because<br>a person in motion has no one</span></div>
      <div id="cap61" class="cap" style="opacity:0"><span>nearby who knows what normal looks like<br>for them.</span></div>
      <div id="cap62" class="cap" style="opacity:0"><span>And notice what has not happened.</span></div>
