      <div id="cap211" class="cap" style="opacity:0"><span>You might be thinking that this is only a<br>story about one small group in one small</span></div>

      <div id="cap214" class="cap" style="opacity:0"><span>In June of</span></div>

      <div id="cap223" class="cap" style="opacity:0"><span>More than nine hundred people died in<br>Jonestown that day.</span></div>
      <div id="cap224" class="cap" style="opacity:0"><span>The affidavit was not wrong.</span></div>
      <div id="cap225" class="cap" style="opacity:0"><span>It was only early.</span></div>
