      <div id="cap150" class="cap" style="opacity:0"><span>Nobody asks what Ines wanted to ask.</span></div>
      <div id="cap151" class="cap" style="opacity:0"><span>Stage five is the walls.</span></div>
      <div id="cap152" class="cap" style="opacity:0"><span>By month five, Nora lives in the Harbor's<br>house.</span></div>
      <div id="cap153" class="cap" style="opacity:0"><span>The rent is lower.</span></div>
      <div id="cap154" class="cap" style="opacity:0"><span>The people are kinder.</span></div>
      <div id="cap155" class="cap" style="opacity:0"><span>Her old lease ended anyway.</span></div>
      <div id="cap156" class="cap" style="opacity:0"><span>The walls are not made of stone.</span></div>
      <div id="cap157" class="cap" style="opacity:0"><span>They are made of schedules.</span></div>
      <div id="cap158" class="cap" style="opacity:0"><span>Phones go into a basket during quiet<br>hours, and the quiet hours keep growing.</span></div>
      <div id="cap159" class="cap" style="opacity:0"><span>Her sister Leah calls, and the call goes<br>to voicemail, and then Nora stops</span></div>
      <div id="cap160" class="cap" style="opacity:0"><span>listening to the voicemails, because<br>Julian once said that people who love you</span></div>
      <div id="cap161" class="cap" style="opacity:0"><span>but do not understand you can feel like<br>weather.</span></div>
      <div id="cap162" class="cap" style="opacity:0"><span>Old friends become the Drift.</span></div>
      <div id="cap163" class="cap" style="opacity:0"><span>Any book outside the reading list feels,<br>somehow, noisy.</span></div>
      <div id="cap164" class="cap" style="opacity:0"><span>Lifton called this milieu control, the<br>control of communication, which can grow</span></div>
      <div id="cap165" class="cap" style="opacity:0"><span>until it reaches inside a person's own<br>thoughts.</span></div>
      <div id="cap166" class="cap" style="opacity:0"><span>Hassan calls the related tool information<br>control.</span></div>
      <div id="cap167" class="cap" style="opacity:0"><span>And notice, there are no guards here.</span></div>
      <div id="cap168" class="cap" style="opacity:0"><span>Nobody has ever stopped Nora from leaving.</span></div>
      <div id="cap169" class="cap" style="opacity:0"><span>The door is unlocked.</span></div>
      <div id="cap170" class="cap" style="opacity:0"><span>The trouble is that there is no one left<br>outside to leave toward.</span></div>
