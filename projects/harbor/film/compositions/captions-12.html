      <div id="cap233" class="cap" style="opacity:0"><span>By morning, Julian Marrow is gone, and a<br>dozen people stand in the kitchen, holding</span></div>
      <div id="cap234" class="cap" style="opacity:0"><span>mugs, with no one left to tell them what</span></div>
      <div id="cap235" class="cap" style="opacity:0"><span>the silence means.</span></div>
      <div id="cap236" class="cap" style="opacity:0"><span>Nora walks out into the yard.</span></div>
      <div id="cap237" class="cap" style="opacity:0"><span>A car is idling by the curb.</span></div>
      <div id="cap238" class="cap" style="opacity:0"><span>And on her phone, which someone has<br>finally returned to her, there is a</span></div>
      <div id="cap239" class="cap" style="opacity:0"><span>voicemail from Leah.</span></div>
      <div id="cap240" class="cap" style="opacity:0"><span>It is thirty seconds long.</span></div>
      <div id="cap241" class="cap" style="opacity:0"><span>Your room is still yellow, her sister<br>says.</span></div>
      <div id="cap242" class="cap" style="opacity:0"><span>I am outside.</span></div>
      <div id="cap243" class="cap" style="opacity:0"><span>I will not make you come.</span></div>
      <div id="cap244" class="cap" style="opacity:0"><span>I just want to hand you your coat.</span></div>
      <div id="cap245" class="cap" style="opacity:0"><span>Nora stands very still.</span></div>
      <div id="cap246" class="cap" style="opacity:0"><span>Lifton observed that when the control over<br>a person's environment is lifted,</span></div>
      <div id="cap247" class="cap" style="opacity:0"><span>something of the earlier self begins to<br>reassert itself.</span></div>
      <div id="cap248" class="cap" style="opacity:0"><span>It does not happen all at once.</span></div>
      <div id="cap249" class="cap" style="opacity:0"><span>It happens like feeling returning to a<br>sleeping arm, which hurts before it helps.</span></div>
      <div id="cap250" class="cap" style="opacity:0"><span>So what does all of this actually mean?</span></div>
      <div id="cap251" class="cap" style="opacity:0"><span>The crack.</span></div>
      <div id="cap252" class="cap" style="opacity:0"><span>The warmth.</span></div>
      <div id="cap253" class="cap" style="opacity:0"><span>The story.</span></div>
      <div id="cap254" class="cap" style="opacity:0"><span>The small yes.</span></div>
      <div id="cap255" class="cap" style="opacity:0"><span>The walls.</span></div>
      <div id="cap256" class="cap" style="opacity:0"><span>The weight.</span></div>
      <div id="cap257" class="cap" style="opacity:0"><span>None of them required a stupid person.</span></div>
