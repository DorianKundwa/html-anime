      <div id="root" data-composition-id="captions-07" data-width="1920" data-height="1080">
      <div id="cap128" class="cap" style="opacity:0"><span>Each yes is small enough to be reasonable.</span></div>
      <div id="cap129" class="cap" style="opacity:0"><span>Together, they do something larger.</span></div>
      <div id="cap130" class="cap" style="opacity:0"><span>Singer's second condition is control of a<br>person's time and surroundings, and Hassan</span></div>
      <div id="cap131" class="cap" style="opacity:0"><span>calls the wider pattern behavior control.</span></div>
      <div id="cap132" class="cap" style="opacity:0"><span>Nobody takes Nora's time.</span></div>
      <div id="cap133" class="cap" style="opacity:0"><span>She hands it over in pieces.</span></div>
      <div id="cap134" class="cap" style="opacity:0"><span>At the retreat, there is a ritual of<br>confession.</span></div>
      <div id="cap135" class="cap" style="opacity:0"><span>Each member says aloud what they are<br>ashamed of, to a partner who writes it</span></div>
      <div id="cap136" class="cap" style="opacity:0"><span>down.</span></div>
      <div id="cap137" class="cap" style="opacity:0"><span>Lifton wrote that in such environments<br>confession has no confidentiality.</span></div>
      <div id="cap138" class="cap" style="opacity:0"><span>What you reveal becomes part of the file.</span></div>
      <div id="cap139" class="cap" style="opacity:0"><span>Nora tells her partner about her father.</span></div>
      <div id="cap140" class="cap" style="opacity:0"><span>About the year she stopped speaking to her<br>sister.</span></div>
      <div id="cap141" class="cap" style="opacity:0"><span>It feels like relief.</span></div>
      <div id="cap142" class="cap" style="opacity:0"><span>It is also, quietly, an archive.</span></div>
      <div id="cap143" class="cap" style="opacity:0"><span>The following week, a business card is<br>taped to the Harbor's front door.</span></div>
      <div id="cap144" class="cap" style="opacity:0"><span>Ines Calloway, reporter.</span></div>
      <div id="cap145" class="cap" style="opacity:0"><span>Seeking former members.</span></div>
      <div id="cap146" class="cap" style="opacity:0"><span>Julian reads it aloud at dinner and<br>smiles.</span></div>
      <div id="cap147" class="cap" style="opacity:0"><span>Reporters, he says, are the loudest static<br>of all.</span></div>
      <div id="cap148" class="cap" style="opacity:0"><span>Everyone laughs with him.</span></div>
