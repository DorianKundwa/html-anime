      <div id="cap191" class="cap" style="opacity:0"><span>The flood never came.</span></div>
      <div id="cap192" class="cap" style="opacity:0"><span>And according to the researchers, the<br>believers who had invested the most were</span></div>
      <div id="cap193" class="cap" style="opacity:0"><span>the least likely to walk away.</span></div>
      <div id="cap194" class="cap" style="opacity:0"><span>Many tried to spread the message harder.</span></div>
      <div id="cap195" class="cap" style="opacity:0"><span>Later scholars have criticized the study,<br>since it followed a tiny group, and the</span></div>
      <div id="cap196" class="cap" style="opacity:0"><span>observers may have shaped what they were<br>watching.</span></div>
      <div id="cap197" class="cap" style="opacity:0"><span>But the pattern it described has stayed<br>with us.</span></div>
      <div id="cap198" class="cap" style="opacity:0"><span>The more you pay, the harder it is to say<br>the price was too high.</span></div>
      <div id="cap199" class="cap" style="opacity:0"><span>The date of the Crossing arrives.</span></div>
      <div id="cap200" class="cap" style="opacity:0"><span>It passes.</span></div>
      <div id="cap201" class="cap" style="opacity:0"><span>Nothing falls.</span></div>
      <div id="cap202" class="cap" style="opacity:0"><span>Nothing rises.</span></div>
      <div id="cap203" class="cap" style="opacity:0"><span>Julian stands before them and says the<br>date was a test, and that they passed it.</span></div>
      <div id="cap204" class="cap" style="opacity:0"><span>And Nora, to her own surprise, cries with<br>relief.</span></div>
      <div id="cap205" class="cap" style="opacity:0"><span>That week, everyone is asked to confess<br>again, this time about their doubts.</span></div>
      <div id="cap206" class="cap" style="opacity:0"><span>Nora's confession from the retreat is read<br>back to her, gently, as a reminder.</span></div>
      <div id="cap207" class="cap" style="opacity:0"><span>The Harbor knows everything about her.</span></div>
      <div id="cap208" class="cap" style="opacity:0"><span>The Harbor loves her anyway.</span></div>
      <div id="cap209" class="cap" style="opacity:0"><span>Or is that the other way around?</span></div>
      <div id="cap210" class="cap" style="opacity:0"><span>Stage seven is the crack, turned inside<br>out.</span></div>
