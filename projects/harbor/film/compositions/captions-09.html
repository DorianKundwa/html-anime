      <div id="cap170" class="cap" style="opacity:0"><span>The trouble is that there is no one left<br>outside to leave toward.</span></div>
      <div id="cap171" class="cap" style="opacity:0"><span>Meanwhile, in Ines Calloway's inbox, a<br>second email arrives from the woman who</span></div>
      <div id="cap172" class="cap" style="opacity:0"><span>signs herself M.</span></div>
      <div id="cap173" class="cap" style="opacity:0"><span>Her name is Mara.</span></div>
      <div id="cap174" class="cap" style="opacity:0"><span>She left the Harbor two years ago.</span></div>
      <div id="cap175" class="cap" style="opacity:0"><span>This time, Ines writes back.</span></div>
      <div id="cap176" class="cap" style="opacity:0"><span>Stage six is the weight.</span></div>
      <div id="cap177" class="cap" style="opacity:0"><span>Julian announces the Crossing.</span></div>
      <div id="cap178" class="cap" style="opacity:0"><span>A date in the spring when the Drift will<br>fall away and the Harbor will rise.</span></div>
      <div id="cap179" class="cap" style="opacity:0"><span>Members begin to give more.</span></div>
      <div id="cap180" class="cap" style="opacity:0"><span>Savings.</span></div>
      <div id="cap181" class="cap" style="opacity:0"><span>A car.</span></div>
      <div id="cap182" class="cap" style="opacity:0"><span>A sublet.</span></div>
      <div id="cap183" class="cap" style="opacity:0"><span>It is because she has already given so<br>much that stopping now would mean</span></div>
      <div id="cap184" class="cap" style="opacity:0"><span>admitting it was all for nothing.</span></div>
      <div id="cap185" class="cap" style="opacity:0"><span>In</span></div>
      <div id="cap186" class="cap" style="opacity:0"><span>a woman in the American Midwest named<br>Dorothy Martin told a small group of</span></div>
      <div id="cap187" class="cap" style="opacity:0"><span>followers that a great flood would arrive<br>before dawn on December twenty-first.</span></div>
      <div id="cap188" class="cap" style="opacity:0"><span>Social psychologist Leon Festinger and his<br>colleagues secretly joined the group to</span></div>
      <div id="cap189" class="cap" style="opacity:0"><span>watch what would happen when it did not.</span></div>
      <div id="cap190" class="cap" style="opacity:0"><span>They published their account in in a book<br>called When Prophecy Fails.</span></div>
