      <div id="root" data-composition-id="captions-06" data-width="1920" data-height="1080">
      <div id="cap107" class="cap" style="opacity:0"><span>Parts of it are.</span></div>
      <div id="cap108" class="cap" style="opacity:0"><span>Then the vocabulary arrives.</span></div>
      <div id="cap109" class="cap" style="opacity:0"><span>Outsiders are the Drift.</span></div>
      <div id="cap110" class="cap" style="opacity:0"><span>Doubt is static.</span></div>
      <div id="cap111" class="cap" style="opacity:0"><span>Leaving is slipping.</span></div>
      <div id="cap112" class="cap" style="opacity:0"><span>When Nora asks a question, someone smiles<br>and says one phrase, that's just static,</span></div>
      <div id="cap113" class="cap" style="opacity:0"><span>and the question dissolves like sugar in<br>tea.</span></div>
      <div id="cap114" class="cap" style="opacity:0"><span>Lifton called this loading the language.</span></div>
      <div id="cap115" class="cap" style="opacity:0"><span>He also described what he called sacred<br>science, the idea that a group's teaching</span></div>
      <div id="cap116" class="cap" style="opacity:0"><span>is beyond question.</span></div>
      <div id="cap117" class="cap" style="opacity:0"><span>Notice how pleasant it feels.</span></div>
      <div id="cap118" class="cap" style="opacity:0"><span>Doubt used to be a problem.</span></div>
      <div id="cap119" class="cap" style="opacity:0"><span>Now it has a label, and the label makes it<br>somebody else's fault.</span></div>
      <div id="cap120" class="cap" style="opacity:0"><span>Is that peace, or is it a locked drawer?</span></div>
      <div id="cap121" class="cap" style="opacity:0"><span>Stage four is the small yes.</span></div>
      <div id="cap122" class="cap" style="opacity:0"><span>Nothing in the Harbor asks for everything<br>at once.</span></div>
      <div id="cap123" class="cap" style="opacity:0"><span>It asks for a Tuesday evening.</span></div>
      <div id="cap124" class="cap" style="opacity:0"><span>Then six a.m.</span></div>
      <div id="cap125" class="cap" style="opacity:0"><span>meditation on Wednesdays.</span></div>
      <div id="cap126" class="cap" style="opacity:0"><span>Then a weekend retreat, forty miles away,<br>which means she will need to skip her temp</span></div>
      <div id="cap127" class="cap" style="opacity:0"><span>shifts.</span></div>
