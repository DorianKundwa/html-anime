      <div id="cap257" class="cap" style="opacity:0"><span>None of them required a stupid person.</span></div>
      <div id="cap258" class="cap" style="opacity:0"><span>Each required a person who was lonely on a<br>Tuesday night, and a group that happened</span></div>
      <div id="cap259" class="cap" style="opacity:0"><span>to notice.</span></div>
      <div id="cap260" class="cap" style="opacity:0"><span>It is worth being honest about the limits.</span></div>
      <div id="cap261" class="cap" style="opacity:0"><span>Researchers do not agree on how to name<br>every piece of this, and some have</span></div>
      <div id="cap262" class="cap" style="opacity:0"><span>criticized models like Hassan's.</span></div>
      <div id="cap263" class="cap" style="opacity:0"><span>Lifton himself warned that these traits<br>exist in degrees, and can be found, in</span></div>
      <div id="cap264" class="cap" style="opacity:0"><span>small amounts, in many ordinary<br>institutions.</span></div>
      <div id="cap265" class="cap" style="opacity:0"><span>The list is a lens.</span></div>
      <div id="cap266" class="cap" style="opacity:0"><span>It is not a verdict.</span></div>
      <div id="cap267" class="cap" style="opacity:0"><span>But the lens shows something true.</span></div>
      <div id="cap268" class="cap" style="opacity:0"><span>Most of us will never meet a Julian<br>Marrow.</span></div>
      <div id="cap269" class="cap" style="opacity:0"><span>We will meet a Daniel.</span></div>
      <div id="cap270" class="cap" style="opacity:0"><span>A warm hand.</span></div>
      <div id="cap271" class="cap" style="opacity:0"><span>A seat at a table.</span></div>
      <div id="cap272" class="cap" style="opacity:0"><span>And the real question is whether, on our<br>own worst Tuesday, we would hear the</span></div>
      <div id="cap273" class="cap" style="opacity:0"><span>difference between being welcomed and<br>being collected.</span></div>
      <div id="cap274" class="cap" style="opacity:0"><span>Leah does not say anything.</span></div>
      <div id="cap275" class="cap" style="opacity:0"><span>She just turns up the heat.</span></div>
      <div id="cap276" class="cap" style="opacity:0"><span>At the first red light, Nora's phone<br>buzzes again.</span></div>
      <div id="cap277" class="cap" style="opacity:0"><span>It is Daniel.</span></div>
      <div id="cap278" class="cap" style="opacity:0"><span>We miss you, the message says.</span></div>
      <div id="cap279" class="cap" style="opacity:0"><span>Static can't hurt you.</span></div>
