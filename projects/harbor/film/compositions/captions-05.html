      <div id="cap83" class="cap" style="opacity:0"><span>Steven Hassan, who spent time in the<br>Unification Church in the 1970s before</span></div>
      <div id="cap84" class="cap" style="opacity:0"><span>becoming a cult researcher and counselor,<br>lists emotional extremes among the main</span></div>
      <div id="cap85" class="cap" style="opacity:0"><span>tools of control, and he places the early<br>flood of affection, often called love</span></div>
      <div id="cap86" class="cap" style="opacity:0"><span>bombing, among them.</span></div>
      <div id="cap87" class="cap" style="opacity:0"><span>The warmth is not fake, exactly.</span></div>
      <div id="cap88" class="cap" style="opacity:0"><span>That is what makes it powerful.</span></div>
      <div id="cap89" class="cap" style="opacity:0"><span>So what is it for?</span></div>
      <div id="cap90" class="cap" style="opacity:0"><span>The Harbor has a quiet rule.</span></div>
      <div id="cap91" class="cap" style="opacity:0"><span>Warmth rises when Nora attends, and cools,<br>just slightly, when she does not.</span></div>
      <div id="cap92" class="cap" style="opacity:0"><span>Nobody says it out loud.</span></div>
      <div id="cap93" class="cap" style="opacity:0"><span>Nobody has to.</span></div>
      <div id="cap94" class="cap" style="opacity:0"><span>That same week, across town, a local<br>reporter named Ines Calloway receives an</span></div>
      <div id="cap95" class="cap" style="opacity:0"><span>email from a stranger.</span></div>
      <div id="cap96" class="cap" style="opacity:0"><span>It is signed with a single letter.</span></div>
      <div id="cap97" class="cap" style="opacity:0"><span>M.</span></div>
      <div id="cap98" class="cap" style="opacity:0"><span>The message is short.</span></div>
      <div id="cap99" class="cap" style="opacity:0"><span>Look into the Harbor.</span></div>
      <div id="cap100" class="cap" style="opacity:0"><span>Ines files it under later.</span></div>
      <div id="cap101" class="cap" style="opacity:0"><span>Stage three is the story.</span></div>
      <div id="cap102" class="cap" style="opacity:0"><span>Julian Marrow does not appear until week<br>five.</span></div>
      <div id="cap103" class="cap" style="opacity:0"><span>He is soft-spoken, and he never raises his<br>voice, which makes the room lean in.</span></div>
      <div id="cap104" class="cap" style="opacity:0"><span>He explains that the world is loud on<br>purpose, a machine built to distract, and</span></div>

      <div id="cap106" class="cap" style="opacity:0"><span>It sounds beautiful.</span></div>
