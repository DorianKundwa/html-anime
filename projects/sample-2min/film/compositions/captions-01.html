      <div id="cap0" class="cap" style="opacity:0"><span>It is eleven at night, and Nora is<br>watching her clothes spin.</span></div>
      <div id="cap1" class="cap" style="opacity:0"><span>The laundromat hums.</span></div>
      <div id="cap2" class="cap" style="opacity:0"><span>A green backpack sits between her feet,<br>the same one she carried through college.</span></div>
      <div id="cap3" class="cap" style="opacity:0"><span>Her phone lies face up on the folding<br>table.</span></div>
      <div id="cap4" class="cap" style="opacity:0"><span>No messages.</span></div>
      <div id="cap5" class="cap" style="opacity:0"><span>Not one.</span></div>
      <div id="cap6" class="cap" style="opacity:0"><span>She checks it anyway.</span></div>
      <div id="cap7" class="cap" style="opacity:0"><span>Three weeks ago, she moved to a city where<br>she knows nobody.</span></div>
      <div id="cap8" class="cap" style="opacity:0"><span>Two weeks ago, the job that was supposed<br>to justify the move disappeared.</span></div>
      <div id="cap9" class="cap" style="opacity:0"><span>Tonight, the loudest voice in her life is<br>a dryer.</span></div>
      <div id="cap10" class="cap" style="opacity:0"><span>Most of us picture a certain kind of<br>person falling into a cult.</span></div>
      <div id="cap11" class="cap" style="opacity:0"><span>Gullible.</span></div>
      <div id="cap12" class="cap" style="opacity:0"><span>Troubled.</span></div>
      <div id="cap13" class="cap" style="opacity:0"><span>Easy to fool.</span></div>
      <div id="cap14" class="cap" style="opacity:0"><span>But what if that picture is the first lie?</span></div>
      <div id="cap15" class="cap" style="opacity:0"><span>What if the only thing a cult truly needs<br>is a night exactly like this one?</span></div>
      <div id="cap16" class="cap" style="opacity:0"><span>In a few minutes, Nora will say yes to<br>something small.</span></div>
      <div id="cap17" class="cap" style="opacity:0"><span>Over the next eleven months, she will pass<br>through seven stages, one after another.</span></div>
      <div id="cap18" class="cap" style="opacity:0"><span>Each will feel gentle.</span></div>
      <div id="cap19" class="cap" style="opacity:0"><span>Each will feel reasonable.</span></div>
      <div id="cap20" class="cap" style="opacity:0"><span>And somewhere along the way, a stranger<br>far outside her sight will begin pulling</span></div>
      <div id="cap21" class="cap" style="opacity:0"><span>on a single loose thread.</span></div>
