      <div id="cap22" class="cap" style="opacity:0"><span>Psychiatrist Robert Jay Lifton laid out<br>the machinery in</span></div>
      <div id="cap23" class="cap" style="opacity:0"><span>after interviewing people who had lived<br>through thought reform in China.</span></div>
      <div id="cap24" class="cap" style="opacity:0"><span>Decades later, psychologist Margaret<br>Singer, working with Janja Lalich on a</span></div>
      <div id="cap25" class="cap" style="opacity:0"><span>book called Cults in Our Midst, showed how<br>the same machinery turns up much closer to</span></div>
      <div id="cap26" class="cap" style="opacity:0"><span>home.</span></div>
      <div id="cap27" class="cap" style="opacity:0"><span>Neither of them found a door marked<br>danger.</span></div>
      <div id="cap28" class="cap" style="opacity:0"><span>They found a door marked welcome.</span></div>
      <div id="cap29" class="cap" style="opacity:0"><span>Here is the idea this story is built on.</span></div>
      <div id="cap30" class="cap" style="opacity:0"><span>A cult does not seize a mind.</span></div>
      <div id="cap31" class="cap" style="opacity:0"><span>It builds a room, one comfortable wall at<br>a time, and waits for a person to walk</span></div>
      <div id="cap32" class="cap" style="opacity:0"><span>into it on their own.</span></div>
      <div id="cap33" class="cap" style="opacity:0"><span>Is that really so unusual?</span></div>
      <div id="cap34" class="cap" style="opacity:0"><span>Singer spent decades working with former<br>members, and she described recruits as</span></div>
      <div id="cap35" class="cap" style="opacity:0"><span>people who were often lonely, between<br>attachments, and sometimes mildly</span></div>
      <div id="cap36" class="cap" style="opacity:0"><span>depressed.</span></div>
      <div id="cap37" class="cap" style="opacity:0"><span>A Education Week report on her work added<br>something surprising.</span></div>
      <div id="cap38" class="cap" style="opacity:0"><span>A researcher quoted there said that people<br>who join cults are generally not the</span></div>
      <div id="cap39" class="cap" style="opacity:0"><span>children of troubled families.</span></div>
