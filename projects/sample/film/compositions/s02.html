        const tl = gsap.timeline({ paused: true });

        for (let n = 0; n < 240; n += 3) {

        tl.set("#s02-eyes", { opacity: 1 }, f(50));
        tl.set("#s02-blink", { opacity: 0 }, f(50));

        tl.set("#s02-brow-c", { opacity: 1 }, f(48));

        tl.fromTo("#s02-title", { opacity: 0, scale: 1.6 }, { opacity: 1, scale: 1, duration: f(3), ease: "power2.out" }, f(96));

        tl.fromTo("#s02-x1", { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: f(6), ease: "none" }, f(144));
        tl.fromTo("#s02-x2", { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: f(6), ease: "none" }, f(147));

        tl.set("#s02-brow-r", { opacity: 0 }, f(192));
        tl.set("#s02-brow-c", { opacity: 1 }, f(192));
        tl.set("#s02-m-n", { opacity: 0 }, f(192));
        tl.set("#s02-m-s", { opacity: 1 }, f(192));

        tl.fromTo("#s02-stage", { scale: 1 }, { scale: 1.06, duration: f(240), ease: "power1.inOut" }, f(0));

        window.__timelines["s02"] = tl;
